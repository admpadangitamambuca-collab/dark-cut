# DarkCut AI v3.0 — Worker de cortes por arquivo no plano gratuito.
# O plano free pode ser insuficiente para vídeos grandes/longos.
services:
  - type: web
    name: darkcut-ai-worker
    runtime: docker
    repo: https://github.com/admpadangitamambuca-collab/dark-cut
    branch: main
    plan: free
    region: virginia
    autoDeployTrigger: commit
    dockerfilePath: ./worker/Dockerfile
    dockerContext: ./worker
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - worker/**
        - render.yaml
    envVars:
      - key: WHISPER_MODEL
        value: tiny
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: JOB_TTL_HOURS
        value: "24"
      - key: MAX_UPLOAD_BYTES
        value: "524288000"
      - key: CORS_ORIGINS
        value: https://reliable-seahorse-fe5df4.netlify.app